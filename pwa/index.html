<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control TV Halley</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 20px; margin: 8px 0 2px; }
  .sub { font-size: 12px; color: #888; margin-bottom: 16px; }
  .cfg {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .cfg-row { display: flex; gap: 6px; }
  #ipInput {
    flex: 1;
    background: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 15px;
  }
  .cfg button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 14px;
    padding: 8px 12px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .cfg button:active { background: #444; }
  #scanMsg { font-size: 13px; color: #999; min-height: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 320px; }
  button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    padding: 18px 0;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  button:active { background: #444; }
  button.power { background: #5a1e1e; border-color: #8a2a2a; grid-column: span 3; }
  button.state { background: #1e3a5a; border-color: #2a6a8a; }
  #status {
    margin-top: 14px;
    font-size: 13px;
    color: #9fb3c8;
    min-height: 16px;
    text-align: center;
  }
  #log {
    margin-top: 12px;
    font-size: 12px;
    color: #999;
    min-height: 20px;
    text-align: center;
    word-break: break-all;
  }
</style>
</head>
<body>
<h1>Control TV</h1>
<div class="sub">Halley TV · control por CDP (firmware MStar) + WOL</div>
<div class="cfg">
  <div class="cfg-row">
    <input id="ipInput" type="text" placeholder="IP de la TV (ej: 192.168.1.108)">
    <button id="applyBtn">Usar</button>
  </div>
  <button id="scanBtn">Buscar TV automaticamente</button>
  <div id="scanMsg"></div>
</div>
<div class="grid">
  <button id="volup">VOL +</button>
  <button id="voldn">VOL -</button>
  <button id="mute" class="state">MUTE</button>
  <button id="chup" class="state">CH &and;</button>
  <button id="chdn" class="state">CH &or;</button>
  <button id="refresh" class="state">ESTADO</button>
  <button class="power" id="power">ENCENDER (WOL)</button>
  <button class="power" id="poweroff">APAGAR</button>
</div>
<div id="status"></div>
<div id="log"></div>
<div class="sub" style="margin-top:12px;">Nota: esta TV <b>no permite apagar por software</b> (verificado: no tiene API de standby en su firmware; solo se apaga con el control físico). No tiene apps Netflix/YouTube. El encendido es por WOL.</div>

<script>
var log = document.getElementById('log');
var statusEl = document.getElementById('status');
var ipInput = document.getElementById('ipInput');
var scanMsg = document.getElementById('scanMsg');
var TV_IP = localStorage.getItem('tvIp') || "192.168.1.108";
ipInput.value = TV_IP;

function logMsg(msg) {
  var stamp = new Date().toLocaleTimeString('es-AR', { hour12: false });
  log.textContent = '[' + stamp + '] ' + msg;
}

function setTvIp(ip) {
  TV_IP = ip;
  ipInput.value = ip;
  localStorage.setItem('tvIp', ip);
}

function cdpPost(path, params) {
  var q = Object.keys(params).map(function(k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(path + '?' + q, { method: 'POST' }).then(function(r) { return r.json(); });
}

function tvStatus() {
  return cdpPost('/tv/status', { ip: TV_IP });
}

function volUp() {
  cdpPost('/tv/vol', { ip: TV_IP, dir: 'up' }).then(function(d) {
    if (d.ok) { logMsg('Volumen: ' + d.volume); refreshStatus(); }
    else { logMsg('VOL + fallo: ' + (d.error || '?')); }
  }).catch(function(e) { logMsg('VOL + fallo: ' + e.message); });
}

function volDown() {
  cdpPost('/tv/vol', { ip: TV_IP, dir: 'down' }).then(function(d) {
    if (d.ok) { logMsg('Volumen: ' + d.volume); refreshStatus(); }
    else { logMsg('VOL - fallo: ' + (d.error || '?')); }
  }).catch(function(e) { logMsg('VOL - fallo: ' + e.message); });
}

var muted = false;

function toggleMute() {
  muted = !muted;
  cdpPost('/tv/mute', { ip: TV_IP, on: muted ? '1' : '0' }).then(function(d) {
    if (d.ok) { logMsg('Mute: ' + (d.mute ? 'ON' : 'OFF')); refreshStatus(); }
    else { logMsg('Mute fallo: ' + (d.error || '?')); muted = !muted; }
  }).catch(function(e) { logMsg('Mute fallo: ' + e.message); muted = !muted; });
}

function channelMove(dir) {
  cdpPost('/tv/channel', { ip: TV_IP, dir: dir }).then(function(d) {
    if (d.ok) { logMsg(d.from + ' -> ' + d.to); refreshStatus(); }
    else { logMsg('Canal fallo: ' + (d.error || '?')); }
  }).catch(function(e) { logMsg('Canal fallo: ' + e.message); });
}

function refreshStatus() {
  tvStatus().then(function(d) {
    if (!d.cdp) { statusEl.textContent = 'TV ' + TV_IP + ' — sin conexion CDP (TV apagada?)'; return; }
    var vol = (typeof d.volume === 'number' && d.volume >= 0) ? 'Vol ' + d.volume : 'Vol ?';
    var ch = d.ok && d.channel
      ? 'CH ' + d.channel.name + ' [' + d.channel.major + (d.channel.minor !== undefined ? '.' + d.channel.minor : '') + ']'
      : 'CH ?';
    statusEl.textContent = 'TV ' + TV_IP + ' — ' + vol + ' · ' + ch;
  }).catch(function(e) { statusEl.textContent = 'TV ' + TV_IP + ' — error: ' + e.message; });
}

function powerOff() {
  logMsg('Esta TV no permite apagar por software (sin API de standby en su firmware)');
}

function powerOn() {
  var subnet = TV_IP.split('.').slice(0, 3).join('.');
  fetch('/wol?subnet=' + encodeURIComponent(subnet), { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) { logMsg('WOL enviado a ' + d.broadcast + ' (MAC ' + d.mac + ')'); }
      else { logMsg('WOL fallo: ' + (d.error || '?')); }
    })
    .catch(function(e) { logMsg('WOL fallo: ' + e.message); });
}

function scanTv() {
  var subnet = TV_IP.split('.').slice(0, 3).join('.');
  scanMsg.textContent = 'Escaneando ' + subnet + '.1-254...';
  fetch('/scan?subnet=' + encodeURIComponent(subnet))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.found || d.found.length === 0) {
        scanMsg.textContent = 'No se encontro ninguna TV. ¿El celular y la PC estan en el mismo WiFi que la TV?';
        return;
      }
      var names = d.found.map(function(f) { return f.ip + ' (' + f.name + ')'; });
      scanMsg.textContent = 'Encontrada: ' + names.join(' | ');
      setTvIp(d.found[0].ip);
      logMsg('TV configurada: ' + TV_IP);
      refreshStatus();
    })
    .catch(function(e) { scanMsg.textContent = 'Escaneo fallo: ' + e.message; });
}

document.getElementById('applyBtn').onclick = function() {
  var ip = ipInput.value.trim();
  if (ip) { setTvIp(ip); logMsg('TV configurada: ' + ip); refreshStatus(); }
};
document.getElementById('scanBtn').onclick = scanTv;
document.getElementById('power').onclick = powerOn;
document.getElementById('poweroff').onclick = powerOff;
document.getElementById('volup').onclick = volUp;
document.getElementById('voldn').onclick = volDown;
document.getElementById('mute').onclick = toggleMute;
document.getElementById('chup').onclick = function() { channelMove('up'); };
document.getElementById('chdn').onclick = function() { channelMove('down'); };
document.getElementById('refresh').onclick = function() { refreshStatus(); };
refreshStatus();
</script>
</body>
</html>
